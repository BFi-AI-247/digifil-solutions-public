# Beispiel: Doko-Block per SFTP auf einen eigenen PHP-Webspace laden.
# Nutzung: nach .github/workflows/doko-deploy.yml kopieren, Secrets eintragen.
#   <WEB>/<PFAD>/          Seiten, api.php, .htaccess, Manifest, Icons
#   <PRIVAT>/doko-block/   zugang.php (beim Upload erzeugt), optional altdaten.json
# Spieldaten (daten.json), Fotos und Protokoll auf dem Server werden nie überschrieben.
# Die Einstellungen der Runde und die Zugänge sind privat und kommen deshalb aus Secrets:
#   DOKO_EINSTELLUNGEN  Inhalt von server/einstellungen.json
#   DOKO_ZUGAENGE       Inhalt von server/zugaenge.json
# Weitere Secrets: SFTP_HOST, SFTP_USER, SFTP_PASSWORD, SFTP_KNOWN_HOSTS (empfohlen),
#   ANTHROPIC_API_KEY / MISTRAL_API_KEY (mind. einer, fürs Auslesen), DOKO_GITHUB_TOKEN (optional, Rückmeldungen)
# Variable: DOKO_PFAD (z. B. /doko/)

name: Deploy Doko-Block

on:
  push:
    branches: [main]
    paths: ["doko-block/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: doko-block
    env:
      H: ${{ secrets.SFTP_HOST }}
      U: ${{ secrets.SFTP_USER }}
      LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      K: ${{ secrets.SFTP_KNOWN_HOSTS }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      DOKO_GITHUB_TOKEN: ${{ secrets.DOKO_GITHUB_TOKEN }}
      DOKO_EINSTELLUNGEN: ${{ secrets.DOKO_EINSTELLUNGEN }}
      DOKO_ZUGAENGE: ${{ secrets.DOKO_ZUGAENGE }}
      DOKO_PFAD: ${{ vars.DOKO_PFAD || '/doko/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Bauen und testen
        run: |
          python -m pip install --quiet playwright pillow && python -m playwright install --with-deps chromium
          command -v php >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq php-cli php-curl; }
          python tools/build.py && php -l server/api.php
          bash tests/lokal.sh "$RUNNER_TEMP/doko" && python tests/e2e.py "$RUNNER_TEMP/shots"
      - name: Hochladen
        run: |
          printf '%s' "$DOKO_EINSTELLUNGEN" > server/einstellungen.json
          printf '%s' "$DOKO_ZUGAENGE" > server/zugaenge.json
          mkdir -p out && python tools/make_zugang.py out/zugang.php
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          mkdir -p ~/.ssh && { [ -n "$K" ] && printf '%s\n' "$K" || ssh-keyscan -T 15 "$H" 2>/dev/null; } > ~/.ssh/known_hosts
          D="/web${DOKO_PFAD%/}"
          lftp -c "set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts';
            open --env-password -u \"$U\" sftp://$H;
            mkdir -p -f $D; mkdir -p -f /privat/doko-block/fotos;
            put out/zugang.php -o /privat/doko-block/zugang.php;
            put server/.htaccess -o $D/.htaccess; put server/api.php -o $D/api.php;
            put server/manifest.webmanifest -o $D/manifest.webmanifest;
            put src/icon-180.png -o $D/icon-180.png; put src/icon-192.png -o $D/icon-192.png; put src/icon-512.png -o $D/icon-512.png;
            put dist/verlauf.html -o $D/verlauf.html; put dist/index.html -o $D/index.html"
