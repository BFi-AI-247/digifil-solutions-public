<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Editor · Blog</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ctext y=%2226%22 font-size=%2226%22%3E%E2%9C%8D%3C/text%3E%3C/svg%3E">
<style>
:root { --bg:#f4f1ec; --fl:#fff; --tx:#22201d; --le:#6d675f; --li:#ddd6cc; --ak:#a4582a; --akt:#fff; --ok:#2f7d4a; --warn:#b7791f; --chip:#ece5da;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --bg:#17140f; --fl:#211c16; --tx:#eee5d9; --le:#a89a8b; --li:#3a3128; --ak:#e09a5f; --akt:#17140f; --ok:#6cc08b; --warn:#e3b35b; --chip:#2e261e; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--tx); font:16px/1.45 var(--ui); }
.vorschau-schild { background:#f6d743; color:#2a2200; font:600 13px/1.3 var(--ui); padding:6px 10px; text-align:center; }
header { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--li); }
.zeile { max-width:46rem; margin:0 auto; padding:10px 14px; display:flex; gap:8px; align-items:center; }
h1 { font-size:1.05rem; margin:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
main { max-width:46rem; margin:0 auto; padding:12px 14px 120px; }
button, .btn { font:600 15px var(--ui); border:1px solid var(--li); background:var(--fl); color:var(--tx); border-radius:10px; padding:9px 13px; cursor:pointer; text-decoration:none; display:inline-block; }
button.haupt { background:var(--ak); color:var(--akt); border-color:var(--ak); }
button.leise { background:transparent; }
button:disabled { opacity:.5; cursor:default; }
.tabs { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 12px; }
.tabs button { padding:6px 12px; border-radius:999px; font-size:14px; }
.tabs button[aria-pressed="true"] { background:var(--tx); color:var(--bg); border-color:var(--tx); }
.liste { list-style:none; margin:0; padding:0; }
.liste li { background:var(--fl); border:1px solid var(--li); border-radius:12px; padding:12px; margin:8px 0; cursor:pointer; }
.liste .t { font-weight:650; }
.liste .m { font-size:13px; color:var(--le); margin-top:3px; display:flex; gap:6px; flex-wrap:wrap; }
.chip { font-size:12px; font-weight:650; padding:1px 8px; border-radius:999px; background:var(--chip); }
.chip.ok { color:var(--ok); } .chip.warn { color:var(--warn); }
label.f { display:block; font-size:13px; font-weight:650; color:var(--le); margin:14px 0 4px; }
input[type=text], input[type=datetime-local], select, textarea { width:100%; font:16px/1.45 var(--ui); color:var(--tx); background:var(--fl); border:1px solid var(--li); border-radius:10px; padding:10px; }
textarea.text { min-height:46vh; font:17px/1.6 Georgia, "Iowan Old Style", serif; resize:vertical; }
textarea.kurz { min-height:120px; }
.zwei { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
/* Kopf eines Beitrags eng: Titel · Serie | Datum | Zeit · Stichwörter mit Vorschlägen */
.kopf-felder label.f { margin:8px 0 3px; font-size:12px; }
.kopf-felder input[type=text], .kopf-felder input[type=date], .kopf-felder input[type=time], .kopf-felder select { padding:7px 9px; border-radius:8px; }
.kopf-felder input[type=date], .kopf-felder input[type=time] { width:100%; min-width:0; font:16px/1.45 var(--ui); color:var(--tx); background:var(--fl); border:1px solid var(--li); }
.drei { display:grid; grid-template-columns:minmax(0,1fr) 8.8rem 5.6rem; gap:6px; }
.drei input[type=date], .drei input[type=time] { padding:7px 5px; }
.drei select { min-width:0; text-overflow:ellipsis; }
.vorschlaege { display:flex; gap:5px; flex-wrap:wrap; margin-top:5px; }
.vorschlaege:empty { display:none; }
.vorschlaege button { font-size:13px; font-weight:600; padding:3px 9px; border-radius:999px; background:var(--chip); border-color:transparent; }
.werkzeug { display:flex; gap:4px; flex-wrap:wrap; margin:6px 0; }
.werkzeug button { padding:6px 10px; font-size:14px; min-width:40px; }
.ansicht { background:var(--fl); border:1px solid var(--li); border-radius:10px; padding:4px 16px; min-height:30vh; font:17px/1.65 Georgia, serif; }
.ansicht img { max-width:100%; height:auto; }
.kasten { background:var(--fl); border:1px solid var(--li); border-radius:12px; padding:12px 14px; margin:18px 0; }
.kasten h2 { font-size:15px; margin:0 0 6px; }
.hinweis { font-size:14px; color:var(--le); margin:4px 0; }
.status-zeile { font-size:14px; font-weight:600; }
.leiste-unten { position:fixed; left:0; right:0; bottom:0; background:var(--bg); border-top:1px solid var(--li); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); }
.leiste-unten .innen { max-width:46rem; margin:0 auto; display:flex; gap:8px; flex-wrap:wrap; }
.leiste-unten .innen > * { flex:1 1 auto; }
.meldung { position:fixed; left:50%; top:70px; transform:translateX(-50%); background:var(--tx); color:var(--bg); padding:10px 16px; border-radius:10px; font-weight:600; z-index:20; max-width:90vw; box-shadow:0 6px 20px #0004; }
.versteckt { display:none !important; }
.klein { font-size:13px; color:var(--le); }
.check { display:flex; gap:8px; align-items:flex-start; margin-top:10px; font-weight:600; }
.check input { width:22px; height:22px; margin:0; }
</style>
</head>
<body>
<div class="vorschau-schild versteckt" id="vs">VORSCHAU · Kopie der Daten – was du hier speicherst, erscheint nicht im echten Blog</div>
<header><div class="zeile">
  <button class="leise versteckt" id="zurueck" aria-label="Zurück">‹</button>
  <h1 id="kopf">Editor</h1>
  <a class="btn leise" id="zumblog" href="../">Blog ↗</a>
</div></header>
<main id="haupt"><p class="hinweis">Lade …</p></main>
<div class="leiste-unten versteckt" id="unten"><div class="innen" id="unten-innen"></div></div>
<input type="file" id="bilddatei" accept="image/*" class="versteckt">

<script>
(function () {
  'use strict';
  var API = '../api.php';
  var K = '';
  try { var m = location.hash.match(/k=([A-Za-z0-9_-]+)/); if (m) { localStorage.setItem('blog-k', m[1]); history.replaceState(null, '', location.pathname); } K = localStorage.getItem('blog-k') || ''; } catch (e) {}
  var $ = function (s, w) { return (w || document).querySelector(s); };
  var haupt = $('#haupt'), unten = $('#unten'), untenInnen = $('#unten-innen'), kopf = $('#kopf'), zurueck = $('#zurueck');
  var STAND = { beitraege: [], serien: [], filter: 'alle', mistral: false };
  var offen = null, geaendert = false;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function melde(t, ms) { var d = document.createElement('div'); d.className = 'meldung'; d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, ms || 2600); }
  function api(a, daten) {
    return fetch(API + '?a=' + a, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Blog-Schluessel': K }, body: JSON.stringify(daten || {}) })
      .then(function (r) { return r.json().catch(function () { return { fehler: 'Unerwartete Antwort vom Server.' }; }).then(function (j) { if (!r.ok) throw new Error(j.fehler || 'Fehler'); return j; }); });
  }
  function datumText(iso) { var d = new Date(iso); return d.toLocaleDateString('de-DE', { day: 'numeric', month: 'short', year: 'numeric' }); }
  function lokalZeit(iso) { var d = iso ? new Date(iso) : new Date(); var p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()); }
  function serieName(id) { var s = STAND.serien.find(function (x) { return x.id === id; }); return s ? s.titel : id; }
  window.addEventListener('beforeunload', function (e) { if (geaendert) { e.preventDefault(); e.returnValue = ''; } });
  zurueck.onclick = function () { if (geaendert && !confirm('Ungespeicherte Änderungen verwerfen?')) return; geaendert = false; liste(); };

  if (!K) { haupt.innerHTML = '<p>Bitte öffne den Editor über deinen persönlichen Link (er endet mit <code>#k=…</code>).</p>'; return; }

  function laden() {
    return api('liste').then(function (j) {
      STAND.beitraege = j.beitraege; STAND.serien = j.serien; STAND.mistral = j.mistral;
      if (j.vorschau) $('#vs').classList.remove('versteckt');
      document.title = 'Editor · ' + (j.name || 'Blog');
    });
  }

  // ---------- Übersicht ----------
  function liste() {
    offen = null; zurueck.classList.add('versteckt'); kopf.textContent = 'Deine Beiträge';
    var f = STAND.filter;
    var l = STAND.beitraege.filter(function (b) {
      return f === 'alle' || (f === 'entwurf' && b.status === 'entwurf') || (f === 'live' && b.status === 'veroeffentlicht')
        || (f === 'en' && b.status === 'veroeffentlicht' && !b.en.geprueft);
    });
    var anzEn = STAND.beitraege.filter(function (b) { return b.status === 'veroeffentlicht' && !b.en.geprueft; }).length;
    haupt.innerHTML = '<div class="tabs" id="filter">'
      + [['alle', 'Alle'], ['entwurf', 'Entwürfe'], ['live', 'Veröffentlicht'], ['en', 'Englisch offen (' + anzEn + ')']].map(function (x) {
        return '<button data-f="' + x[0] + '" aria-pressed="' + (f === x[0]) + '">' + x[1] + '</button>'; }).join('')
      + '<button id="serien-knopf">Serien</button></div>'
      + (l.length ? '<ul class="liste">' + l.map(function (b) {
        var chips = '<span class="chip ' + (b.status === 'veroeffentlicht' ? 'ok' : '') + '">' + (b.status === 'veroeffentlicht' ? 'online' : 'Entwurf') + '</span>';
        if (b.serie) chips += '<span class="chip">' + esc(serieName(b.serie)) + '</span>';
        chips += b.en.geprueft ? (b.en.veraltet ? '<span class="chip warn">EN veraltet</span>' : '<span class="chip ok">EN ✓</span>')
          : (b.en.da ? '<span class="chip warn">EN prüfen</span>' : '<span class="chip">EN fehlt</span>');
        return '<li data-id="' + esc(b.id) + '"><div class="t">' + esc(b.titel) + '</div><div class="m"><span>' + datumText(b.datum) + '</span>' + chips + '</div></li>';
      }).join('') + '</ul>' : '<p class="hinweis">Hier ist noch nichts.</p>');
    $('#filter').onclick = function (e) { var b = e.target.closest('button[data-f]'); if (b) { STAND.filter = b.dataset.f; liste(); } };
    $('#serien-knopf').onclick = serienAnsicht;
    haupt.querySelectorAll('.liste li').forEach(function (li) { li.onclick = function () { oeffne(li.dataset.id); }; });
    untenInnen.innerHTML = '<button class="haupt" id="neu">＋ Neuer Beitrag</button>';
    unten.classList.remove('versteckt');
    $('#neu').onclick = function () { bearbeiten({ id: '', titel: '', text: '', datum: '', serie: null, stichwoerter: [], status: 'entwurf', en: { titel: '', text: '', geprueft: false, stand: '' }, herkunft: { quelle: 'editor' } }); };
  }

  function oeffne(id) { api('hole', { id: id }).then(function (j) { bearbeiten(j.beitrag); }).catch(function (e) { melde(e.message); }); }

  // ---------- Bearbeiten ----------
  function bearbeiten(b) {
    offen = b; geaendert = false; zurueck.classList.remove('versteckt');
    kopf.textContent = b.id ? b.titel : 'Neuer Beitrag';
    var lokal = null;
    try { lokal = JSON.parse(localStorage.getItem('blog-sicher-' + (b.id || 'neu')) || 'null'); } catch (e) {}
    var serienOpt = '<option value="">– keine Serie –</option>' + STAND.serien.map(function (s) {
      return '<option value="' + esc(s.id) + '"' + (s.id === b.serie ? ' selected' : '') + '>' + esc(s.titel) + '</option>'; }).join('') + '<option value="+">＋ Neue Serie …</option>';
    haupt.innerHTML =
      (lokal && lokal.text !== b.text ? '<div class="kasten"><b>Ungespeicherter Stand gefunden</b> vom ' + new Date(lokal.zeit).toLocaleString('de-DE')
        + '. <button id="wiederher">Wiederherstellen</button> <button class="leise" id="verwerfen">Verwerfen</button></div>' : '')
      + (b.import ? '<p class="hinweis">Übernommen aus ' + esc(b.herkunft.quelle || 'Import') + '. Deine Änderungen speichere ich als eigene Fassung – der Import bleibt unangetastet.</p>' : '')
      + '<div class="kopf-felder"><label class="f" for="titel">Titel</label><input type="text" id="titel" value="' + esc(b.titel) + '" maxlength="200">'
      + '<div class="drei"><div><label class="f" for="serie">Serie</label><select id="serie">' + serienOpt + '</select></div>'
      + '<div><label class="f" for="datum">Datum</label><input type="date" id="datum" value="' + (b.datum ? lokalZeit(b.datum) : lokalZeit()).slice(0, 10) + '"></div>'
      + '<div><label class="f" for="zeit">Zeit</label><input type="time" id="zeit" value="' + (b.datum ? lokalZeit(b.datum) : lokalZeit()).slice(11, 16) + '"></div></div>'
      + '<label class="f" for="stichwoerter">Stichwörter <span class="klein">(mit Komma getrennt)</span></label><input type="text" id="stichwoerter" autocomplete="off" value="' + esc((b.stichwoerter || []).join(', ')) + '">'
      + '<div class="vorschlaege" id="sw-vorschlaege" aria-label="Schon verwendete Stichwörter"></div></div>'
      + '<div class="tabs" id="modus" style="margin-top:16px"><button data-m="schreiben" aria-pressed="true">Schreiben</button><button data-m="ansehen" aria-pressed="false">Ansehen</button></div>'
      + '<div id="schreiben"><div class="werkzeug">'
      + '<button data-w="h" title="Zwischenüberschrift">Ü</button><button data-w="b" title="Fett"><b>F</b></button><button data-w="i" title="Kursiv"><i>K</i></button>'
      + '<button data-w="l" title="Link">🔗</button><button data-w="ul" title="Liste">•</button><button data-w="q" title="Zitat">❝</button><button data-w="bild" title="Bild einfügen">🖼 Bild</button></div>'
      + '<textarea class="text" id="text" spellcheck="true">' + esc(b.text) + '</textarea>'
      + '<p class="klein">Absatz = leere Zeile. **fett**, *kursiv*, [Linktext](Adresse), „## “ am Zeilenanfang für eine Zwischenüberschrift. Link auf einen eigenen Beitrag: [Text](beitrag:kennung) – die Kennung steht unten bei „Adresse“.</p></div>'
      + '<div id="ansehen" class="ansicht versteckt"></div>'
      + '<div class="kasten" id="en-kasten"><h2>Englische Fassung</h2><p class="status-zeile" id="en-status"></p>'
      + '<div><button id="uebersetzen">Übersetzen lassen</button> <button class="leise" id="en-zeigen">Bearbeiten</button></div>'
      + '<div id="en-felder" class="versteckt"><label class="f" for="en-titel">Titel (Englisch)</label><input type="text" id="en-titel" value="' + esc(b.en.titel) + '">'
      + '<label class="f" for="en-text">Text (Englisch)</label><textarea class="text" id="en-text">' + esc(b.en.text) + '</textarea></div>'
      + '<label class="check"><input type="checkbox" id="en-geprueft"' + (b.en.geprueft ? ' checked' : '') + '> Geprüft – die englische Fassung darf erscheinen</label></div>'
      + (b.id ? '<p class="klein">Adresse: <a href="../' + esc(b.id) + '/" target="_blank" rel="noopener">…/' + esc(b.id) + '/</a>'
        + (b.status === 'veroeffentlicht' ? '' : ' (erst nach dem Veröffentlichen erreichbar)') + '</p>'
        + '<p><button class="leise" id="loeschen">In den Papierkorb</button></p>' : '');

    var feld = function (id) { return $('#' + id); };
    var merke = function () { geaendert = true; try { localStorage.setItem('blog-sicher-' + (b.id || 'neu'), JSON.stringify({ zeit: Date.now(), titel: feld('titel').value, text: feld('text').value })); } catch (e) {} };
    ['titel', 'datum', 'zeit', 'serie', 'stichwoerter', 'text', 'en-titel', 'en-text', 'en-geprueft'].forEach(function (id) { feld(id).addEventListener('input', merke); feld(id).addEventListener('change', merke); });
    stichwortHilfe();
    if ($('#wiederher')) { $('#wiederher').onclick = function () { feld('titel').value = lokal.titel; feld('text').value = lokal.text; geaendert = true; this.parentNode.remove(); };
      $('#verwerfen').onclick = function () { try { localStorage.removeItem('blog-sicher-' + (b.id || 'neu')); } catch (e) {} this.parentNode.remove(); }; }
    feld('serie').onchange = function () { if (this.value === '+') { var n = prompt('Name der neuen Serie:'); this.value = b.serie || '';
      if (n && n.trim()) api('serie', { titel: n.trim(), einleitung: '' }).then(function (j) { STAND.serien = j.serien; var o = document.createElement('option'); o.value = j.serie.id; o.textContent = j.serie.titel; feld('serie').insertBefore(o, feld('serie').lastChild); feld('serie').value = j.serie.id; merke(); melde('Serie angelegt'); }).catch(function (e) { melde(e.message); }); } };
    $('#modus').onclick = function (e) {
      var k = e.target.closest('button[data-m]'); if (!k) return;
      $('#modus').querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === k)); });
      var an = k.dataset.m === 'ansehen';
      $('#schreiben').classList.toggle('versteckt', an); $('#ansehen').classList.toggle('versteckt', !an);
      if (an) api('vorschau', { text: feld('text').value }).then(function (j) { $('#ansehen').innerHTML = '<h1>' + esc(feld('titel').value) + '</h1>' + j.html.replace(/src="\//g, 'src="/'); });
    };
    $('.werkzeug').onclick = function (e) { var k = e.target.closest('button[data-w]'); if (k) werkzeug(k.dataset.w, feld('text')); merke(); };
    zeigeEn(b);
    $('#en-zeigen').onclick = function () { $('#en-felder').classList.toggle('versteckt'); };
    $('#uebersetzen').onclick = function () { if (!b.id) { melde('Bitte zuerst speichern.'); return; } speichern().then(function () { return uebersetzen(); }); };
    if ($('#loeschen')) $('#loeschen').onclick = function () { if (confirm('Diesen Beitrag in den Papierkorb legen? Er verschwindet aus dem Blog.')) status('geloescht'); };

    untenInnen.innerHTML = '<button id="speichern">Speichern</button>'
      + (b.status === 'veroeffentlicht' ? '<button class="leise" id="zurueckziehen">Zurückziehen</button>' : '<button class="haupt" id="veroeff">Veröffentlichen</button>');
    unten.classList.remove('versteckt');
    $('#speichern').onclick = function () { speichern().then(function (j) { if (j) melde('Gespeichert'); }); };
    if ($('#veroeff')) $('#veroeff').onclick = function () { speichern().then(function (j) { if (j && confirm('Jetzt veröffentlichen? Der Beitrag ist dann sofort im Blog und im Feed.')) status('veroeffentlicht'); }); };
    if ($('#zurueckziehen')) $('#zurueckziehen').onclick = function () { if (confirm('Beitrag aus dem Blog nehmen? Er bleibt als Entwurf erhalten.')) status('entwurf'); };
  }

  function zeigeEn(b) {
    var s = $('#en-status'), t;
    if (!b.en.text) t = 'Noch nicht übersetzt.' + (STAND.mistral ? ' Wird nach dem Speichern automatisch übersetzt.' : ' (Übersetzung nicht eingerichtet – du kannst sie von Hand schreiben.)');
    else if (b.en_veraltet) t = '⚠ Veraltet – der deutsche Text wurde danach geändert. ' + (b.en.geprueft ? 'Bis du neu prüfst, erscheint die alte englische Fassung. „Übersetzen lassen“ holt eine neue.' : (STAND.mistral ? 'Beim nächsten Speichern übersetze ich neu.' : ''));
    else if (b.en.geprueft) t = '✓ Geprüft – erscheint unter /en/.';
    else t = 'Übersetzt, noch nicht geprüft – erscheint erst nach deinem Haken.';
    s.textContent = t;
    $('#uebersetzen').disabled = !STAND.mistral;
  }

  function zeitpunkt(tag, zeit) {
    var d = new Date((tag || lokalZeit().slice(0, 10)) + 'T' + (zeit || '00:00'));
    return isNaN(d) ? new Date().toISOString() : d.toISOString();
  }
  // Stichwörter: Vorschläge aus schon verwendeten (häufigste zuerst), passend zum gerade getippten Wortanfang
  function stichwortHilfe() {
    var feldSw = $('#stichwoerter'), box = $('#sw-vorschlaege');
    var zahl = {};
    STAND.beitraege.forEach(function (x) { (x.stichwoerter || []).forEach(function (w) { var k = String(w).trim(); if (k) zahl[k] = (zahl[k] || 0) + 1; }); });
    var alle = Object.keys(zahl).sort(function (a, b) { return zahl[b] - zahl[a] || a.localeCompare(b, 'de'); });
    function zeigen() {
      var teile = feldSw.value.split(','), anfang = teile[teile.length - 1].trim().toLowerCase();
      var schon = teile.slice(0, -1).concat(anfang ? [] : teile.slice(-1)).map(function (x) { return x.trim().toLowerCase(); });
      var l = alle.filter(function (w) { var k = w.toLowerCase(); return schon.indexOf(k) < 0 && (!anfang || k.indexOf(anfang) === 0 || k.indexOf(' ' + anfang) >= 0) && k !== anfang; }).slice(0, 8);
      box.innerHTML = l.map(function (w) { return '<button type="button" data-w="' + esc(w) + '">＋ ' + esc(w) + '</button>'; }).join('');
    }
    box.onclick = function (e) {
      var k = e.target.closest('button[data-w]'); if (!k) return;
      var teile = feldSw.value.split(','); teile[teile.length - 1] = ' ' + k.dataset.w;
      feldSw.value = teile.map(function (x) { return x.trim(); }).filter(Boolean).join(', ') + ', ';
      feldSw.dispatchEvent(new Event('input')); feldSw.focus(); zeigen();
    };
    feldSw.addEventListener('input', zeigen);
    zeigen();
  }

  function sammle() {
    return { id: offen.id, titel: $('#titel').value, datum: zeitpunkt($('#datum').value, $('#zeit').value), serie: $('#serie').value === '+' ? '' : $('#serie').value,
      stichwoerter: $('#stichwoerter').value.split(',').map(function (s) { return s.trim(); }).filter(Boolean), text: $('#text').value,
      en: { titel: $('#en-titel').value, text: $('#en-text').value, geprueft: $('#en-geprueft').checked } };
  }
  function speichern() {
    var knopf = $('#speichern'); knopf.disabled = true;
    var warNeu = !offen.id;
    return api('speichern', sammle()).then(function (j) {
      try { localStorage.removeItem('blog-sicher-' + (offen.id || 'neu')); } catch (e) {}
      geaendert = false; offen = j.beitrag; kopf.textContent = offen.titel;
      return laden().then(function () {
        if (warNeu) bearbeiten(offen); else zeigeEn(offen);
        if (j.uebersetzen_noetig && STAND.mistral && !$('#en-geprueft').checked) uebersetzen();
        return j;
      });
    }).catch(function (e) { melde(e.message, 4000); return null; }).finally(function () { var k = $('#speichern'); if (k) k.disabled = false; });
  }
  function uebersetzen() {
    var k = $('#uebersetzen'); if (k) { k.disabled = true; k.textContent = 'Übersetze …'; }
    return api('uebersetzen', { id: offen.id }).then(function (j) {
      offen.en = j.en; offen.en_veraltet = false;
      if ($('#en-titel')) { $('#en-titel').value = j.en.titel; $('#en-text').value = j.en.text; $('#en-geprueft').checked = false; zeigeEn(offen); $('#en-felder').classList.remove('versteckt'); }
      melde('Englische Fassung ist da – bitte prüfen.'); laden();
    }).catch(function (e) { melde(e.message, 4000); }).finally(function () { var k = $('#uebersetzen'); if (k) { k.disabled = !STAND.mistral; k.textContent = 'Übersetzen lassen'; } });
  }
  function status(s) {
    api('status', { id: offen.id, status: s }).then(function () {
      melde(s === 'veroeffentlicht' ? 'Ist online ✓' : s === 'entwurf' ? 'Zurückgezogen – jetzt Entwurf' : 'Im Papierkorb');
      return laden().then(function () { if (s === 'geloescht') liste(); else oeffne(offen.id); });
    }).catch(function (e) { melde(e.message, 4000); });
  }

  // ---------- Schreib-Werkzeuge ----------
  function werkzeug(w, ta) {
    var a = ta.selectionStart, e = ta.selectionEnd, v = ta.value, sel = v.slice(a, e);
    var setze = function (vor, nach, platz) { var t = sel || platz || ''; ta.setRangeText(vor + t + nach, a, e, 'end'); if (!sel && platz) { ta.selectionStart = a + vor.length; ta.selectionEnd = a + vor.length + t.length; } ta.focus(); };
    var zeilenAnfang = function (z) { var s = v.lastIndexOf('\n', a - 1) + 1; ta.setRangeText(z, s, s, 'end'); ta.focus(); };
    if (w === 'b') setze('**', '**', 'fett');
    else if (w === 'i') setze('*', '*', 'kursiv');
    else if (w === 'h') zeilenAnfang('## ');
    else if (w === 'ul') zeilenAnfang('- ');
    else if (w === 'q') zeilenAnfang('> ');
    else if (w === 'l') { var url = prompt('Adresse des Links (https://…):', 'https://'); if (url && url !== 'https://') setze('[', '](' + url.trim() + ')', 'Linktext'); }
    else if (w === 'bild') { var d = $('#bilddatei'); d.value = ''; d.onchange = function () { if (d.files[0]) bildHoch(d.files[0], ta); }; d.click(); }
  }
  function verkleinere(datei) {
    return new Promise(function (ok) {
      if (!/^image\/(jpeg|png|webp)$/.test(datei.type)) return ok(datei);
      var img = new Image(); img.onload = function () {
        var max = 1600, s = Math.min(1, max / Math.max(img.width, img.height));
        if (s === 1 && datei.size < 1500000) return ok(datei);
        var c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function (b) { ok(b || datei); }, 'image/jpeg', 0.85);
      }; img.onerror = function () { ok(datei); }; img.src = URL.createObjectURL(datei);
    });
  }
  function bildHoch(datei, ta) {
    var alt = prompt('Kurze Beschreibung des Bildes (für Menschen, die es nicht sehen):', '') || '';
    melde('Lade Bild hoch …', 1500);
    verkleinere(datei).then(function (blob) {
      var fd = new FormData(); fd.append('bild', blob, 'bild.jpg'); fd.append('alt', alt);
      return fetch(API + '?a=bild', { method: 'POST', headers: { 'X-Blog-Schluessel': K }, body: fd }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.fehler); return j; }); });
    }).then(function (j) { ta.setRangeText('\n\n' + j.markdown + '\n\n', ta.selectionStart, ta.selectionEnd, 'end'); ta.focus(); geaendert = true; melde('Bild eingefügt'); })
      .catch(function (e) { melde(e.message || 'Bild ging nicht.', 4000); });
  }

  // ---------- Serien ----------
  function serienAnsicht() {
    zurueck.classList.remove('versteckt'); kopf.textContent = 'Serien'; offen = null;
    haupt.innerHTML = STAND.serien.map(function (s) {
      var n = STAND.beitraege.filter(function (b) { return b.serie === s.id && b.status === 'veroeffentlicht'; }).length;
      return '<div class="kasten" data-id="' + esc(s.id) + '"><label class="f">Name</label><input type="text" class="s-titel" value="' + esc(s.titel) + '">'
        + '<label class="f">Einleitung (erscheint auf der Serienseite)</label><textarea class="kurz s-ein">' + esc(s.einleitung) + '</textarea>'
        + '<label class="f">Name (Englisch)</label><input type="text" class="s-en-titel" value="' + esc(s.en.titel) + '">'
        + '<label class="f">Einleitung (Englisch)</label><textarea class="kurz s-en-ein">' + esc(s.en.einleitung) + '</textarea>'
        + '<label class="check"><input type="checkbox" class="s-geprueft"' + (s.en.geprueft ? ' checked' : '') + '> Englisch geprüft</label>'
        + '<p class="klein">' + n + ' veröffentlichte Teile · Adresse …/serie/' + esc(s.id) + '/</p>'
        + '<button class="s-speichern">Speichern</button> <button class="leise s-uebersetzen"' + (STAND.mistral ? '' : ' disabled') + '>Übersetzen lassen</button></div>';
    }).join('') + '<p><button id="s-neu">＋ Neue Serie</button></p>';
    unten.classList.add('versteckt');
    haupt.querySelectorAll('.kasten').forEach(function (k) {
      var id = k.dataset.id;
      k.querySelector('.s-speichern').onclick = function () {
        api('serie', { id: id, titel: k.querySelector('.s-titel').value, einleitung: k.querySelector('.s-ein').value,
          en: { titel: k.querySelector('.s-en-titel').value, einleitung: k.querySelector('.s-en-ein').value, geprueft: k.querySelector('.s-geprueft').checked } })
          .then(function (j) { STAND.serien = j.serien; melde('Serie gespeichert'); }).catch(function (e) { melde(e.message); });
      };
      k.querySelector('.s-uebersetzen').onclick = function () {
        var knopf = this; knopf.disabled = true; knopf.textContent = 'Übersetze …';
        api('uebersetzen', { serie: id }).then(function (j) { k.querySelector('.s-en-titel').value = j.serie.en.titel; k.querySelector('.s-en-ein').value = j.serie.en.einleitung;
          k.querySelector('.s-geprueft').checked = false; melde('Übersetzt – bitte prüfen und speichern.'); return laden(); })
          .catch(function (e) { melde(e.message); }).finally(function () { knopf.disabled = false; knopf.textContent = 'Übersetzen lassen'; });
      };
    });
    $('#s-neu').onclick = function () { var n = prompt('Name der neuen Serie:'); if (n && n.trim()) api('serie', { titel: n.trim(), einleitung: '' }).then(function (j) { STAND.serien = j.serien; serienAnsicht(); }).catch(function (e) { melde(e.message); }); };
  }

  laden().then(liste).catch(function (e) { haupt.innerHTML = '<p>' + esc(e.message) + '</p>'; });
})();
</script>
</body>
